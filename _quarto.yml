project:
  type: website
  output-dir: docs
  execute-dir: project
  post-render: materiales/calculos/scripts/reparar_docx.R
  render:
    - "*.qmd"
    - "materiales/**/*.qmd"
    - "slides/**/*.qmd"
    - "!refs/"
  resources:
    - data/
    - assets/

website:
  title: "PAN ECIRC"
  site-url: https://renatovargas.github.io/pan-ecirc/
  repo-url: https://github.com/renatovargas/pan-ecirc
  repo-branch: main
  repo-actions: [source]
  description: "Economía circular en Panamá"
  navbar:
    left:
      - href: index.qmd
        text: Inicio
      - href: materiales/index.qmd
        text: Materiales
      - href: about.qmd
        text: Acerca de
  sidebar:
    - id: materiales
      title: Materiales
      style: docked
      search: false
      contents:
        - text: "Materiales"
          href: materiales/index.qmd
        - section: Documentos
          href: materiales/documentos/index.qmd
          contents:
            - text: "A1a. Metodología"
              href: materiales/documentos/a1a-metodologia/index.qmd
            - text: "A1b. Plan de trabajo"
              href: materiales/documentos/a1b-plan-de-trabajo/index.qmd
            - text: "A1c. Sectores económicos priorizados"
              href: materiales/documentos/a1c-sectores-economicos-priorizados/index.qmd
        - text: "Memorias de cálculo"
          href: materiales/calculos/index.qmd
        - text: "Presentaciones"
          href: materiales/presentaciones/index.qmd

format:
  html:
    theme:
      - yeti
      - styles.scss
    css: styles.css
    toc: true
